# -- Basic Settings ------------------------------------------
set -g prefix C-Space
set -sg escape-time 200
set -g mouse on
set-option -g focus-event on

# -- Status Bar ---------------------------------------------
set -g status-position bottom
set -g status-justify left
set -g status-interval 1
set -g status-right "" # Show nothing on right
set -g status-style 'fg=green'
set -g status-left "" 
set -g status-left-length 10

setw -g window-status-current-style 'fg=black bg=green'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=green bg=black'
setw -g window-status-format ' #I #[fg=white]#W #[fg=yellow]#F '

setw -g window-status-bell-style 'fg=yellow bg=green bold'

# -- Panes -------------------------------------------------
set -g pane-border-style 'fg=green'
set -g pane-active-border-style 'fg=white'

# -- Key Bindings ------------------------------------------

# Pane splitting
bind | split-window -h
bind _ split-window -v

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# -- Other -------------------------------------------------
# copy mode
setw -g mode-style 'fg=black bg=green bold'

# messages
set -g message-style 'fg=yellow bg=green bold'
