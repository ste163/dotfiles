# -- Basic Settings ------------------------------------------
set -g prefix C-Space
set -sg escape-time 200
set -g mouse on
set-option -g focus-event on

# -- Status Bar ---------------------------------------------
set -g status-position bottom
set -g status-interval 1
set -g status-style 'fg=blue'

# Two-row status: row 0 is an empty spacer that creates visual separation
# between the nvim statusline and the tab bar; row 1 holds the window list.
set -g status 2
set -g status-format[0] ''
set -g status-format[1] '#[align=left]#{W:#{E:window-status-format},#{E:window-status-current-format}}'

setw -g window-status-current-format '#[fg=black,bg=blue] #I #W #[default]'
setw -g window-status-format '#[fg=blue,bg=black] #I #[fg=white,bg=black]#W #[default]'

setw -g window-status-bell-style 'fg=yellow bg=blue bold'

# -- Panes -------------------------------------------------
set -g pane-border-style 'fg=grey'
set -g pane-active-border-style 'fg=blue'

# -- Key Bindings ------------------------------------------

# Pane splitting
bind | split-window -h
bind _ split-window -v

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# -- Other -------------------------------------------------
# copy mode
setw -g mode-style 'fg=black bg=blue bold'

# messages
set -g message-style 'fg=yellow bg=blue bold'
