# -- Basic Settings ------------------------------------------
set -g prefix C-Space
set -sg escape-time 200
set -g mouse on
set-option -g focus-event on
set -g extended-keys on
set -g extended-keys-format csi-u

# Allow apps (neovim image rendering) to wrap escape sequences in tmux's
# DCS passthrough envelope so the terminal (Ghostty) receives them untouched.
# "all" (tmux 3.4+) forwards passthrough even from invisible panes -- needed
# for nvim to delete images after its window loses focus; "on" drops them.
set -gq allow-passthrough all

# -- Status Bar ---------------------------------------------
set -g status-position bottom
set -g status-interval 1
set -g status-style 'fg=#3e8fb0'
set -g status-left ''
set -g status-right ''

setw -g window-status-current-format '#[fg=black,bg=#3e8fb0] #I #W #[default]'
setw -g window-status-current-style 'fg=black,bg=#3e8fb0'
setw -g window-status-format '#[fg=#3e8fb0,bg=black] #I #[fg=white,bg=black]#W #[default]'

setw -g window-status-bell-style 'fg=yellow bg=#3e8fb0 bold'

# -- Panes -------------------------------------------------
set -g pane-border-style 'fg=grey'
set -g pane-active-border-style 'fg=#3e8fb0'

# -- Key Bindings ------------------------------------------

# Pane splitting
bind | split-window -h
bind _ split-window -v



# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# -- Other -------------------------------------------------
# copy mode
setw -g mode-style 'fg=black bg=#3e8fb0 bold'

# messages
set -g message-style 'fg=yellow bg=#3e8fb0 bold'

# -- State Autosave -----------------------------------------
# Hooks save session state on every structural change and on client detach
# (the moment before a reboot). No keybind. Hook names vary by tmux
# version - verify with `tmux show-hooks -g` on new machines. Blind on
# all versions: swap-pane, move-pane, break-pane, join-pane, and
# same-session move-window; the next covered event or detach catches up.
set-hook -g client-detached       'run-shell "$HOME/.local/bin/tmux-state-save"'
set-hook -g window-linked         'run-shell "$HOME/.local/bin/tmux-state-save"'
set-hook -g window-unlinked       'run-shell "$HOME/.local/bin/tmux-state-save"'
set-hook -g session-closed        'run-shell "$HOME/.local/bin/tmux-state-save"'
set-hook -g session-created       'run-shell "$HOME/.local/bin/tmux-state-save"'
set-hook -g session-renamed       'run-shell "$HOME/.local/bin/tmux-state-save"'
set-hook -g after-select-layout   'run-shell "$HOME/.local/bin/tmux-state-save"'
set-hook -g after-split-window    'run-shell "$HOME/.local/bin/tmux-state-save"'
set-hook -g after-kill-pane       'run-shell "$HOME/.local/bin/tmux-state-save"'
set-hook -g after-resize-pane     'run-shell "$HOME/.local/bin/tmux-state-save"'
set-hook -g after-resize-window   'run-shell "$HOME/.local/bin/tmux-state-save"'
set-hook -g after-swap-window     'run-shell "$HOME/.local/bin/tmux-state-save"'
set-hook -g after-rename-window   'run-shell "$HOME/.local/bin/tmux-state-save"'
set-hook -g after-rename-session  'run-shell "$HOME/.local/bin/tmux-state-save"'
set-hook -g after-select-pane     'run-shell "$HOME/.local/bin/tmux-state-save"'
